</style></head><body><header><div class="kicker" style="color:#c5cbff">ACCOUNTING STUDY SPACE</div><h1>✦ 會計分錄・互動複習室</h1><p>從觀念理解到實際判斷借貸，陪你一步步練熟每一筆分錄。</p></header><div class="shell"><aside class="sidebar"><h3>複習選單</h3><div class="nav-list"><button class="nav active" data-view="home">⌂ 學習總覽</button><button class="nav" data-view="learn">▤ 章節筆記</button><button class="nav" data-view="practice">✎ 分錄測驗</button><button class="nav" data-view="flash">▣ 翻轉記憶卡</button><button class="nav" data-view="wrong">↻ 錯題複習 <small id="wrongBadge"></small></button></div><div style="padding:12px 9px 2px"><div class="mini muted">複習範圍</div><b>11 個章節・31 道分錄題</b><div class="rule"></div><div class="mini muted">資料來源：上傳的《分錄複習》20 頁講義。內容以講義示範分錄為準。</div></div></aside><main class="content"><div class="stats"><div class="stat"><span>已答題數</span><strong id="doneNum">0</strong></div><div class="stat"><span>作答正確率</span><strong id="rateNum">—</strong></div><div class="stat"><span>待複習錯題</span><strong id="wrongNum">0</strong></div></div><div id="app"></div></main></div><div class="footer">本網頁可離線使用・學習紀錄儲存於此瀏覽器・題目選自講義並作必要的文字精簡</div><script>
const DATA={"sections": [["分錄基礎", 2, "先判斷會計項目，再運用借貸法則，最後確認金額與借貸平衡。", "資產、費用增加通常記借方；負債、權益、收入增加通常記貸方。"], ["開業與資本", 3, "業主投入現金、土地、設備等資產，借記各項資產、貸記業主資本。", "投入資產按題目給定價值入帳；開辦費依講義例題另記費用。"], ["進貨", 4, "區分現購、賒購、預付貨款、進貨費用與進貨退出。", "講義主要以定期盤存制的「進貨」科目示範。"], ["銷貨", 8, "區分現銷、賒銷、預收貨款、運費與銷貨退回。", "訂金收取時先貸記預收貨款，交貨再認列銷貨收入。"], ["票據", 11, "即期支票通常使用銀行存款；遠期支票、本票使用應收／應付票據。", "尚未承兌之遠期匯票仍按應收／應付帳款處理。"], ["讓價與折扣", 12, "商業折扣以折後成交價入帳；講義將成交後現金折扣記作進貨折讓／銷貨折讓。", "判斷折扣起算日與付款期限。"], ["不動產、廠房及設備", 16, "買價與使資產達可供使用狀態前的必要直接支出，計入取得成本。", "非必要的意外修理費不計入設備成本。"], ["營業費用與代收款", 17, "薪資、租金、保險及代扣的所得稅／勞健保款項分開記錄。", "代扣款屬代收款，並非直接沖減薪資支出。"], ["暫收暫付款", 18, "款項性質未明可先列暫收款；員工預領差旅費可先列暫付款。", "查明原因或報銷後再沖轉暫收／暫付款。"], ["營業外收支", 18, "利息收入、租金收入與利息費用等營業外項目須分別入帳。", "償還借款時要區分本金與利息。"], ["業主往來與存貨制度", 19, "臨時的業主與企業往來使用業主往來；原始投資或增資主要使用業主資本。", "定期盤存制和永續盤存制在進貨、銷貨成本處理上不同。"]], "questions": [[1, "瓜哥以現金 $500,000、土地 $700,000、房屋 $300,000、存貨 $60,000 開設商店。", [["現金", 500000], ["土地成本", 700000], ["房屋及建築成本", 300000], ["存貨", 60000]], [["業主資本", 1560000]], "投入的四項資產借記，總額貸記業主資本。", 3], [1, "業主投入現金 $80,000 及專利權 $120,000 增資。", [["現金", 80000], ["專利權", 120000]], [["業主資本", 200000]], "增資增加業主資本。", 3], [2, "名洞商店現購商品 $15,000。", [["進貨", 15000]], [["現金", 15000]], "依講義的定期盤存制示範，買入商品使用「進貨」。", 4], [2, "斧山商店購入商品 $50,000，付現 $20,000，餘款暫欠。", [["進貨", 50000]], [["現金", 20000], ["應付帳款", 30000]], "現付與賒欠分別貸記。", 4], [2, "訂購商品 $25,000，預付訂金 $5,000。", [["預付貨款", 5000]], [["現金", 5000]], "訂金支付時，買方認列資產「預付貨款」。", 5], [2, "收到先前訂購的商品 $25,000，扣除已付訂金 $5,000，餘款現付。", [["進貨", 25000]], [["預付貨款", 5000], ["現金", 20000]], "收到商品時沖轉預付款。", 5], [2, "現購商品 $100,000，起運點交貨，買方支付運費 $5,000。", [["進貨", 100000], ["進貨費用", 5000]], [["現金", 105000]], "起運點交貨由買方負擔的運費列進貨費用。", 7], [2, "先前賒購商品有瑕疵，退貨 $4,000，直接扣抵未付款。", [["應付帳款", 4000]], [["進貨退出", 4000]], "成交後退貨可沖減應付帳款。", 7], [3, "現銷商品 $60,000。", [["現金", 60000]], [["銷貨收入", 60000]], "現銷收到現金、產生銷貨收入。", 8], [3, "銷售商品 $40,000，收現 $25,000，其餘暫欠。", [["現金", 25000], ["應收帳款", 15000]], [["銷貨收入", 40000]], "賒欠餘額為 15,000。", 8], [3, "客戶訂購商品 $25,000，本店先收訂金 $5,000。", [["現金", 5000]], [["預收貨款", 5000]], "收到訂金還未交貨，先列負債。", 9], [3, "已收訂金 $5,000 的商品總價 $25,000 已交貨，餘款賒欠。", [["預收貨款", 5000], ["應收帳款", 20000]], [["銷貨收入", 25000]], "交貨後認列收入並沖轉預收款。", 9], [3, "賒銷商品 $100,000，目的地交貨，賣方付運費 $5,000。", [["應收帳款", 100000], ["運費", 5000]], [["銷貨收入", 100000], ["現金", 5000]], "目的地交貨的運費由賣方負擔。", 9], [3, "兩天前現銷商品有部分退回，退還客戶現金 $20,000。", [["銷貨退回", 20000]], [["現金", 20000]], "成交後退貨借記銷貨退回。", 10], [4, "A 商店購買商品 $8,000，簽發即期支票付款。請作買方分錄。", [["進貨", 8000]], [["銀行存款", 8000]], "講義以即期支票對應銀行存款。", 11], [4, "A 商店購買商品 $10,000，簽發遠期支票付款。請作買方分錄。", [["進貨", 10000]], [["應付票據", 10000]], "遠期支票列應付票據。", 11], [4, "已賒購 $40,000 商品，現在承兌賣方開立的遠期匯票。請作買方承兌分錄。", [["應付帳款", 40000]], [["應付票據", 40000]], "承兌時將應付帳款轉為應付票據。", 12], [5, "賒購商品定價 $150,000，八折成交。", [["進貨", 120000]], [["應付帳款", 120000]], "商業折扣成交前直接以折後價入帳。", 14], [5, "7/2 賒購商品定價 $100,000，八折成交，條件 1/15、n/30；7/10 以現金還清。請作 7/10 分錄。", [["應付帳款", 80000]], [["現金", 79200], ["進貨折讓", 800]], "以折後價 80,000 計算 1% 現金折扣 800。", 14], [5, "賒銷商品 $20,000，付款條件 1/10、n/30，買方在折扣期限內償還半數貨款 $10,000。請作賣方收款分錄。", [["現金", 9900], ["銷貨折讓", 100]], [["應收帳款", 10000]], "講義將折扣 100 記為銷貨折讓。", 15], [6, "購買傳真機 $20,000、運費 $1,500，另因運送途中碰撞付修繕費 $300，均付現。", [["辦公設備成本", 21500], ["修繕費", 300]], [["現金", 21800]], "意外碰撞修理費列費用，非資產取得成本。", 16], [6, "以現金購入運輸設備 $300,000、關稅 $15,000，並付交通罰單 $2,000。", [["運輸設備成本", 315000], ["其他損失", 2000]], [["現金", 317000]], "關稅計入成本，罰單列損失。", 16], [7, "以現金支付本月辦公大樓租金 $50,000 與押金 $100,000。", [["租金支出", 50000], ["存出保證金", 100000]], [["現金", 150000]], "押金記作資產，不是租金費用。", 17], [7, "簽發即期支票付薪資 $50,000，代扣所得稅 5% 和健保費 $2,000。", [["薪資支出", 50000]], [["代收款-所得稅", 2500], ["代收款-健保費", 2000], ["銀行存款", 45500]], "薪資費用按總額認列，代扣款先列負債。", 17], [8, "員工出差，向公司預領現金 $10,000。", [["暫付款", 10000]], [["現金", 10000]], "預領時先認列暫付款。", 18], [8, "銀行通知收到不明原因的匯款 $10,000。", [["銀行存款", 10000]], [["暫收款", 10000]], "款項性質未明時列暫收款。", 18], [9, "出租閒置廠房，現收租金 $35,000。", [["現金", 35000]], [["租金收入", 35000]], "非主要營業活動出租廠房，依講義列租金收入。", 18], [9, "以現金償還銀行短期借款本金 $25,000、利息 $2,000。", [["銀行借款", 25000], ["利息費用", 2000]], [["現金", 27000]], "本金償還借記銀行借款，利息借記費用。", 18], [10, "業主提取現金 $20,000 自用。", [["業主往來", 20000]], [["現金", 20000]], "業主臨時提款以業主往來記錄。", 19], [10, "業主代墊本月店租 $50,000。", [["租金支出", 50000]], [["業主往來", 50000]], "費用仍是店租，公司欠業主的代墊款列業主往來。", 19], [10, "定期盤存制下，業主提取成本 $6,000 的商品自用。", [["業主往來", 6000]], [["進貨", 6000]], "依講義定期盤存制，業主領用存貨沖減進貨。", 19]]};
const sections=DATA.sections.map((s,i)=>({id:i,title:s[0],page:s[1],summary:s[2],tip:s[3]}));
const questions=DATA.questions.map((q,i)=>({id:i,section:q[0],text:q[1],debit:q[2],credit:q[3],why:q[4],page:q[5]}));
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toLocaleString('zh-TW');
let state;try{state=JSON.parse(localStorage.getItem('journal-review-v1'))||{answers:{},wrong:[],attempts:0,correct:0}}catch(e){state={answers:{},wrong:[],attempts:0,correct:0}};const save=()=>{localStorage.setItem('journal-review-v1',JSON.stringify(state));stats()};
let view='home',chapter=0,quizPool=[],qi=0,selected=null,checked=false,flashPool=[],fi=0,flipped=false,practiceMode='all';

function nav(v){view=v;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function heading(title,description){return `<h2>${title}</h2><p class="muted">${description}</p>`}
function home(){return `<div class="panel">${heading('今天想從哪裡開始？','依講義順序閱讀筆記，或直接挑戰互動題庫。')}<div class="toolbar"><button class="btn primary" onclick="startQuiz('all')">開始分錄測驗 →</button><button class="btn" onclick="nav('flash')">用記憶卡複習</button><button class="btn" onclick="nav('learn')">閱讀章節重點</button></div><div class="lesson"><b>✦ 分錄三步驟</b>① 判斷會計項目　→　② 運用借貸法則　→　③ 確認借貸金額平衡<br><span class="mini muted">講義第 2 頁</span></div><h3>章節目錄</h3><div class="chapter-grid">${sections.map(s=>`<button class="chapter" onclick="openChapter(${s.id})"><span class="pill">第 ${s.page} 頁起</span><h3>${esc(s.title)}</h3><small>${questions.filter(q=>q.section===s.id).length} 道練習題 →</small></button>`).join('')}</div></div>`}
function openChapter(n){chapter=n;nav('learn')}
function lesson(){let s=sections[chapter],qs=questions.filter(q=>q.section===chapter);return `<div class="panel">${heading('章節筆記', '依照原講義章節整理，搭配範例掌握分錄。')}<select class="select" aria-label="選擇章節" onchange="chapter=Number(this.value);render()">${sections.map(c=>`<option value="${c.id}" ${chapter===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select><div class="rule"></div><span class="pill">講義第 ${s.page} 頁起</span><h2 style="margin-top:10px">${esc(s.title)}</h2><p>${esc(s.summary)}</p><div class="lesson"><b>掌握關鍵</b>${esc(s.tip)}</div><h3>範例分錄</h3>${qs.length?qs.slice(0,2).map(q=>`<div class="box-label">${esc(q.text)}</div>${journal(q)}<p class="mini muted">${esc(q.why)}・講義第 ${q.page} 頁</p>`).join(''):'本章著重概念，請從其他章節的練習題入手。'}<div class="toolbar"><button class="btn primary" onclick="startQuiz(${chapter})">練習本章 ${qs.length} 題</button><button class="btn" onclick="chapter=Math.max(0,chapter-1);render()" ${chapter===0?'disabled':''}>上一章</button><button class="btn" onclick="chapter=Math.min(${sections.length-1},chapter+1);render()" ${chapter===sections.length-1?'disabled':''}>下一章</button></div></div>`}
function journal(q){let rows=[...q.debit.map(x=>[x[0],x[1],null]),...q.credit.map(x=>[x[0],null,x[1]])];return `<table class="journal"><thead><tr><th>會計項目</th><th class="num">借方</th><th class="num">貸方</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="num dr">${r[1]===null?'':money(r[1])}</td><td class="num cr">${r[2]===null?'':money(r[2])}</td></tr>`).join('')}</tbody><tfoot><tr><th>合計</th><th class="num">${money(q.debit.reduce((a,x)=>a+x[1],0))}</th><th class="num">${money(q.credit.reduce((a,x)=>a+x[1],0))}</th></tr></tfoot></table>`}
function getOptions(q){const right=q.debit.map(x=>x[0]);const correct=right.join('、');let distractors=[q.credit.map(x=>x[0]).join('、'),...questions.filter(x=>x.id!==q.id&&x.debit.length===q.debit.length).map(x=>x.debit.map(y=>y[0]).join('、'))].filter(x=>x&&x!==correct);distractors=[...new Set(distractors)];let arr=[correct,...distractors.slice(0,3)];let seed=q.id*7+11;return arr.map((x,i)=>({label:x,correct:i===0})).sort((a,b)=>{let h=s=>[...s.label].reduce((t,c)=>t+c.charCodeAt(0),seed)%17;return h(a)-h(b)||a.label.localeCompare(b.label)});}
function startQuiz(which){practiceMode=which;quizPool=which==='all'?questions.map(q=>q.id):which==='wrong'?[...state.wrong]:questions.filter(q=>q.section===which).map(q=>q.id);qi=0;selected=null;checked=false;nav(which==='wrong'?'wrong':'practice')}
function questionUI(){if(!quizPool.length)return `<div class="panel empty"><h2>目前沒有題目</h2><p class="muted">目前沒有錯題，可以先做一般練習。</p><button class="btn primary" onclick="startQuiz('all')">開始練習</button></div>`;if(qi>=quizPool.length)return `<div class="panel empty"><h2>🎉 本輪練習完成！</h2><p>本輪共練習 ${quizPool.length} 題。可重新挑戰、查看筆記或回顧錯題。</p><div class="toolbar" style="justify-content:center"><button class="btn primary" onclick="startQuiz(practiceMode)">再練一次</button><button class="btn" onclick="nav('wrong')">查看錯題</button></div></div>`;let q=questions[quizPool[qi]],opts=getOptions(q);return `<div class="panel"><div class="row"><span class="pill">${esc(sections[q.section].title)} ・ 講義 p.${q.page}</span><span class="counts question-index">第 ${qi+1} / ${quizPool.length} 題</span></div><div class="progress" style="margin:15px 0"><span style="width:${100*(qi)/quizPool.length}%"></span></div><div class="box-label">請選出正確的「借方會計項目」</div><div class="question">${esc(q.text)}</div><div class="choices">${opts.map((o,i)=>`<button class="choice ${selected===i?'chosen':''} ${checked?(o.correct?'correct':selected===i?'wrong':''):''}" onclick="choose(${i})" ${checked?'disabled':''}><b>${'ABCD'[i]}.</b> ${esc(o.label)}</button>`).join('')}</div><div id="answerArea">${checked?feedback(q,opts):''}</div><div class="toolbar" style="margin-top:19px"><button class="btn primary" onclick="${checked?'nextQuiz()':'checkAnswer()'}" ${!checked&&selected===null?'disabled':''}>${checked?'下一題 →':'檢查答案'}</button><button class="btn" onclick="reveal()" ${checked?'disabled':''}>直接看解答</button></div><p class="mini muted">先判斷借方，再看詳解中的完整分錄與貸方金額。錯題會自動加入錯題本。</p></div>`}
function choose(i){if(checked)return;selected=i;render()}
function feedback(q,opts){let ok=selected!==null&&opts[selected].correct;return `<div class="feedback ${ok?'good':'bad'}"><b>${selected===null?'已顯示解答':ok?'✓ 答對了！':'✕ 這題再複習一下'}</b><p>${esc(q.why)}</p></div><h3>完整標準分錄</h3>${journal(q)}<div class="mini muted">參考：上傳講義第 ${q.page} 頁</div>`}
function grade(revealOnly=false){let q=questions[quizPool[qi]],opts=getOptions(q),ok=!revealOnly&&selected!==null&&opts[selected].correct;checked=true;if(!revealOnly){state.attempts++;if(ok)state.correct++;state.answers[q.id]=ok;if(ok)state.wrong=state.wrong.filter(x=>x!==q.id);else if(!state.wrong.includes(q.id))state.wrong.push(q.id);}else if(!state.wrong.includes(q.id))state.wrong.push(q.id);save();render()}
function checkAnswer(){grade(false)}function reveal(){grade(true)}function nextQuiz(){qi++;selected=null;checked=false;render()}
function practice(){if(!quizPool.length&&practiceMode==='all')quizPool=questions.map(q=>q.id);return `<div class="toolbar"><button class="tab ${practiceMode==='all'?'active':''}" onclick="startQuiz('all')">全章練習</button><select class="select" aria-label="選擇練習章節" onchange="if(this.value!=='')startQuiz(Number(this.value))"><option value="">選章節練習</option>${sections.map(s=>`<option value="${s.id}" ${practiceMode===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select></div>${questionUI()}`}
function wrong(){return `<div class="toolbar"><span class="pill">錯題本 ${state.wrong.length} 題</span><button class="btn primary" onclick="startQuiz('wrong')" ${!state.wrong.length?'disabled':''}>重新挑戰錯題</button><button class="btn" onclick="if(confirm('確定清空錯題紀錄？')){state.wrong=[];save();render()}">清空錯題</button></div>${practiceMode==='wrong'&&quizPool.length?questionUI():`<div class="panel">${state.wrong.length?state.wrong.map(i=>`<div class="row"><div><b>${esc(questions[i].text)}</b><div class="mini muted">${esc(sections[questions[i].section].title)}・講義 p.${questions[i].page}</div></div><button class="btn" onclick="quizPool=[${i}];qi=0;selected=null;checked=false;practiceMode='wrong';render()">重練</button></div><div class="rule"></div>`).join(''):'<div class="empty">目前沒有錯題。完成測驗後，答錯的題目會出現在這裡。</div>'}</div>`}`}
function flash(){if(!flashPool.length)flashPool=questions.map(q=>q.id);let q=questions[flashPool[fi%flashPool.length]];return `<div class="panel">${heading('翻轉記憶卡','先在腦中寫出借貸分錄，再翻面核對答案。')}<div class="row"><select class="select" onchange="flashPool=this.value==='all'?questions.map(q=>q.id):questions.filter(q=>q.section===Number(this.value)).map(q=>q.id);fi=0;flipped=false;render()"><option value="all">全部章節</option>${sections.map(s=>`<option value="${s.id}" ${flashPool.length&&flashPool.every(i=>questions[i].section===s.id)?'selected':''}>${esc(s.title)}</option>`).join('')}</select><span class="counts">${fi+1} / ${flashPool.length}</span></div><div class="flashcard" onclick="flipped=!flipped;render()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'){flipped=!flipped;render()}"><div style="width:100%">${flipped?`<div class="pill">答案・借貸分錄</div>${journal(q)}<p class="mini muted">${esc(q.why)}</p>`:`<div class="pill">題目・講義 p.${q.page}</div><div class="question">${esc(q.text)}</div><div class="mini muted">點擊卡片查看答案</div>`}</div></div><div class="toolbar" style="justify-content:space-between;margin-top:15px"><button class="btn" onclick="fi=(fi-1+flashPool.length)%flashPool.length;flipped=false;render()">← 上一張</button><button class="btn primary" onclick="flipped=!flipped;render()">${flipped?'返回題目':'翻面看答案'}</button><button class="btn" onclick="fi=(fi+1)%flashPool.length;flipped=false;render()">下一張 →</button></div></div>`}
function render(){stats();$('app').innerHTML=view==='home'?home():view==='learn'?lesson():view==='practice'?practice():view==='wrong'?wrong():flash()};render();
</script></body></html>
